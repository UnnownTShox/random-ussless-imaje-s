<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI-generated surreal landscape</title>
  <desc id="desc">A dreamy abstract scene with floating geometric forms, glowing gradients, and a soft cosmic sky.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b2d"/>
      <stop offset="25%" stop-color="#1f1a53"/>
      <stop offset="60%" stop-color="#1d5b8a"/>
      <stop offset="100%" stop-color="#5bd8d0"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7b5" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#ffd36d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffd36d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hill1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7eb6"/>
      <stop offset="50%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <linearGradient id="hill2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ef9d2"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#090812" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>

  <circle cx="600" cy="430" r="260" fill="url(#sunGlow)"/>

  <g opacity="0.85" filter="url(#blurSoft)">
    <circle cx="250" cy="220" r="80" fill="#9be7ff" opacity="0.3"/>
    <circle cx="980" cy="180" r="110" fill="#ffa1d6" opacity="0.28"/>
    <circle cx="960" cy="820" r="120" fill="#7ef9d2" opacity="0.18"/>
    <circle cx="220" cy="890" r="90" fill="#9d7bff" opacity="0.20"/>
  </g>

  <g opacity="0.9">
    <path d="M0 770 C180 620, 260 610, 400 690 S690 780, 820 690 S1080 620, 1200 680 L1200 1200 L0 1200 Z" fill="url(#hill1)" opacity="0.72"/>
    <path d="M0 820 C170 710, 310 700, 510 760 S850 840, 1200 760 L1200 1200 L0 1200 Z" fill="url(#hill2)" opacity="0.8"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M455 640 C510 530, 610 500, 690 560 C750 605, 780 680, 742 740 C700 806, 610 840, 520 820 C466 806, 420 766, 455 640 Z" fill="#f7d5ff" opacity="0.9"/>
    <path d="M475 660 C520 590, 590 570, 645 595 C690 616, 718 660, 700 706 C680 756, 625 782, 560 780 C510 778, 465 735, 475 660 Z" fill="#ffd166" opacity="0.45"/>
  </g>

  <g opacity="0.9">
    <circle cx="640" cy="193" r="12" fill="#fff8d3"/>
    <circle cx="710" cy="220" r="8" fill="#fff8d3"/>
    <circle cx="525" cy="262" r="9" fill="#fff8d3"/>
    <circle cx="890" cy="310" r="10" fill="#fff8d3"/>
    <circle cx="310" cy="320" r="7" fill="#fff8d3"/>
  </g>

  <g opacity="0.75" filter="url(#blurSoft)">
    <path d="M100 965 L220 770 L330 965 Z" fill="#d4f8ff" opacity="0.55"/>
    <path d="M950 980 L1055 760 L1160 980 Z" fill="#d4f8ff" opacity="0.45"/>
  </g>

  <g>
    <path d="M200 500 C245 470, 290 430, 330 400" fill="none" stroke="#d8f5ff" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <path d="M865 400 C905 435, 940 470, 980 520" fill="none" stroke="#d8f5ff" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
