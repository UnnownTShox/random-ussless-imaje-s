<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Random forest scene</title>
  <desc id="desc">A surreal forest with glowing trees, floating mushrooms, and a dreamlike twilight sky.</desc>

  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1b1638"/>
      <stop offset="35%" stop-color="#2b3d6d"/>
      <stop offset="70%" stop-color="#355a6d"/>
      <stop offset="100%" stop-color="#8ae0bd"/>
    </linearGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe6" stop-opacity="1"/>
      <stop offset="35%" stop-color="#e7f7ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e7f7ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ground" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#163e2b"/>
      <stop offset="50%" stop-color="#1b5b43"/>
      <stop offset="100%" stop-color="#0f2d24"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="treeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050914" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#sky)"/>
  <circle cx="930" cy="230" r="140" fill="url(#moonGlow)"/>
  <circle cx="930" cy="230" r="48" fill="#f4f2db" opacity="0.95"/>

  <g opacity="0.7" filter="url(#softGlow)">
    <circle cx="180" cy="180" r="70" fill="#76d7ff"/>
    <circle cx="250" cy="320" r="65" fill="#a8f5d0"/>
    <circle cx="1040" cy="320" r="80" fill="#ffb3d9"/>
    <circle cx="1010" cy="760" r="95" fill="#8ee7b3"/>
  </g>

  <path d="M0 790 C180 700, 310 720, 470 780 S820 860, 1200 760 L1200 1200 L0 1200 Z" fill="url(#ground)"/>
  <path d="M90 820 C260 760, 350 780, 520 840 S910 910, 1200 830" fill="none" stroke="#7ce6c8" stroke-width="8" opacity="0.4"/>

  <g filter="url(#treeShadow)">
    <g transform="translate(120 250)">
      <rect x="145" y="420" width="28" height="170" rx="10" fill="#2f1f18"/>
      <circle cx="160" cy="350" r="110" fill="#2ee0a4"/>
      <circle cx="105" cy="390" r="85" fill="#77f0c8"/>
      <circle cx="215" cy="390" r="82" fill="#4ae2b8"/>
      <circle cx="160" cy="305" r="92" fill="#9df6d6"/>
      <circle cx="160" cy="255" r="25" fill="#d4fff0" opacity="0.8"/>
    </g>

    <g transform="translate(380 230)">
      <rect x="145" y="430" width="30" height="200" rx="12" fill="#2d1c1b"/>
      <circle cx="160" cy="330" r="120" fill="#ff8ac4"/>
      <circle cx="90" cy="390" r="95" fill="#ffb2da"/>
      <circle cx="235" cy="390" r="96" fill="#ff7cb1"/>
      <circle cx="160" cy="270" r="95" fill="#ffd4ec"/>
    </g>

    <g transform="translate(700 260)">
      <rect x="140" y="410" width="30" height="190" rx="12" fill="#281b1b"/>
      <circle cx="155" cy="330" r="118" fill="#82d7ff"/>
      <circle cx="90" cy="385" r="90" fill="#b9ecff"/>
      <circle cx="228" cy="390" r="90" fill="#60c3ff"/>
      <circle cx="155" cy="270" r="90" fill="#d7f5ff"/>
    </g>
  </g>

  <g>
    <g transform="translate(220 730)">
      <circle cx="0" cy="0" r="16" fill="#ffeb7a"/>
      <path d="M0 -18 L11 0 L-11 0 Z" fill="#ffd84a"/>
      <path d="M-14 10 L0 0 L14 10" fill="none" stroke="#ffd84a" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g transform="translate(760 700)">
      <circle cx="0" cy="0" r="18" fill="#d1ff75"/>
      <path d="M0 -20 L12 0 L-12 0 Z" fill="#9de95a"/>
      <path d="M-16 12 L0 2 L16 12" fill="none" stroke="#9de95a" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g transform="translate(940 620)">
      <circle cx="0" cy="0" r="12" fill="#ff9ad7"/>
      <path d="M0 -14 L8 0 L-8 0 Z" fill="#ff6ec9"/>
      <path d="M-12 10 L0 0 L12 10" fill="none" stroke="#ff6ec9" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <g opacity="0.75" fill="none" stroke="#d8faff" stroke-width="3" stroke-linecap="round">
    <path d="M180 460 C210 485, 240 500, 270 520"/>
    <path d="M890 470 C930 495, 955 510, 990 530"/>
    <path d="M430 570 C460 595, 500 610, 540 620"/>
  </g>
</svg>
